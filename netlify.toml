[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # These endpoints and model identifiers are public configuration, not credentials.
  SECRETS_SCAN_OMIT_KEYS = "AGNES_BASE_URL,AGNES_MODEL,AGNES_TEXT_MODEL,IMAGE_API_BASE_URL,IMAGE_MODEL,OPENROUTER_MODEL"
  # Turbopack's build cache is not deployed; it can retain environment values between builds.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
